<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock to us</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #2c2c2c;
        }

        .container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 20px 30px;
            background: #f5f6ee;
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .clock-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 110px;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #888;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .time {
            font-size: 26px;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: #1a1a1a;
        }

        .date {
            font-size: 11px;
            color: #777;
            margin-top: 2px;
        }

        /* Floating Hearts Animation */
        .hearts-container {
            position: absolute;
            width: 40px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            overflow: visible;
        }

        .heart {
            position: absolute;
            font-size: 12px;
            opacity: 0;
            animation: floatHeart 4s infinite ease-in-out;
        }

        .heart:nth-child(1) { animation-delay: 0s; }
        .heart:nth-child(2) { animation-delay: 2s; }

        @keyframes floatHeart {
            0% {
                left: 0px;
                bottom: 20%;
                opacity: 0;
                transform: scale(0.6);
            }
            20% {
                opacity: 0.8;
                transform: scale(1);
            }
            80% {
                opacity: 0.8;
                transform: scale(1);
            }
            100% {
                left: 28px;
                bottom: 75%;
                opacity: 0;
                transform: scale(0.6);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="clock-box">
            <span class="label">Tati</span>
            <div class="time" id="tati-time">--:--</div>
            <div class="date" id="tati-date">---</div>
        </div>

        <div class="hearts-container">
            <div class="heart">❤️</div>
            <div class="heart">💕</div>
        </div>


        <div class="clock-box">
            <span class="label">Mica</span>
            <div class="time" id="my-time">--:--</div>
            <div class="date" id="my-date">---</div>
        </div>
    </div>

    <script>
        function updateClocks() {
            const now = new Date();

           
            const myTimeOpts = { timeZone: 'America/Argentina/Buenos_Aires', hour: '2-digit', minute: '2-digit', hour12: false };
            const myDateOpts = { timeZone: 'America/Argentina/Buenos_Aires', weekday: 'short', month: 'short', day: 'numeric' };

            const tatiTimeOpts = { timeZone: 'Asia/Irkutsk', hour: '2-digit', minute: '2-digit', hour12: false };
            const tatiDateOpts = { timeZone: 'Asia/Irkutsk', weekday: 'short', month: 'short', day: 'numeric' };

            // Actualizar en pantalla
            document.getElementById('my-time').textContent = new Intl.DateTimeFormat([], myTimeOpts).format(now);
            document.getElementById('my-date').textContent = new Intl.DateTimeFormat([], myDateOpts).format(now);

            document.getElementById('tati-time').textContent = new Intl.DateTimeFormat([], tatiTimeOpts).format(now);
            document.getElementById('tati-date').textContent = new Intl.DateTimeFormat([], tatiDateOpts).format(now);
        }

        updateClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
